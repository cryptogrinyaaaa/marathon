<!doctype html>
<html lang="uk"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bezsmertnyi Marathon</title>
<style>
:root{--bg:#0a0a0a;--card:#1a1a1a;--card2:#141414;--line:#2c2c2c;--tx:#f2f2f2;--mut:#9a9a9a;--g:#6fdc7a;--r:#ef5350;--y:#f5a800;--b:#4e8ba6;--red:#e53935;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.4}
.m{font-family:ui-monospace,"JetBrains Mono",Consolas,monospace}
header{border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--red);display:grid;place-items:center;font-size:20px}
header b{display:block;font-size:15px}header small{color:var(--mut);font-size:12px}
header button{margin-left:auto}
.pg{padding:12px 16px;border-bottom:1px solid var(--line)}
.pg div.t{display:flex;justify-content:space-between;font-weight:700;font-size:13px;letter-spacing:1px}
.pg .pc{color:var(--y)}
.bar{height:10px;background:#1c1c1c;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;min-width:6px;background:linear-gradient(90deg,#e53935,#f5a800,#ffd54f);border-radius:8px}
.w{max-width:1000px;margin:0 auto;padding:14px 12px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,#2a1414,#1a1a1a 55%)}
.who{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.av{width:50px;height:50px;border-radius:50%;background:#333;border:2px solid var(--red);display:grid;place-items:center;font-size:24px;flex:none}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.who h2{margin:0;font-size:20px}
.tag{background:var(--red);font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;vertical-align:middle;margin-left:6px}
.who small{color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:#141414;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.tile small{display:block;color:var(--mut);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.tile b{display:block;font-size:clamp(22px,5vw,30px);margin:4px 0;font-weight:800}
.tile span{color:var(--mut);font-size:11px}
.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.hd h3{margin:0;font-size:15px;letter-spacing:1px}
.pills button{background:#141414;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;text-transform:uppercase}
.pills button.on{background:var(--red);border-color:var(--red);color:#fff}
select,input{background:#0f0f0f;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px;font-size:14px;min-width:0}
.chart{background:#141414;border:1px solid var(--line);border-radius:10px;padding:6px;overflow-x:auto}
svg{width:100%;height:auto;display:block;min-width:520px}
.cap{color:var(--mut);font-size:12px;margin-top:8px}
.k3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:12px}
.k3 div{background:#141414;border:1px solid var(--line);border-left:3px solid var(--b);border-radius:8px;padding:10px}
.k3 em{font-style:normal;color:#d9b36c;font-weight:700;font-size:14px;display:block}
.k3 b{font-size:22px;display:block}.k3 small{color:var(--mut);font-size:11px}
form{display:flex;flex-wrap:wrap;gap:8px}
form input[name=n]{flex:1 1 140px}
button.pr,form button{background:var(--y);color:#000;border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
button.x{background:none;border:0;color:var(--mut);cursor:pointer}
button.s{background:#141414;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 5px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500;font-size:11px}
td.n,th.n{text-align:right}
.tw{overflow-x:auto}.hint{color:var(--mut);font-size:12px;margin-top:8px}
</style>
</head>

<script>
(function(){
var S=JSON.parse(document.getElementById('state').textContent);var C=S.cur||'$',showSet=false,pw=localStorage.getItem('pw')||'';
var app=document.getElementById('app'),canEdit=false,art=null,timer=null,per='all',step=50;
var MN=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
var $=function(n){return(n<0?'-':'')+Math.abs(Math.round(n)).toLocaleString('uk-UA').replace(/\u00a0/g,' ')+C};
var sg=function(n){return(n>0?'+':'')+$(n)};
var K=function(n){var a=Math.abs(n);return(n<0?'-':'')+(a>=1e6?(a/1e6).toFixed(1)+'M':a>=1e3?(a/1e3).toFixed(a>=1e5?0:1)+'k':Math.round(a))};
var cl=function(n){return n>0?'g':n<0?'r':''};
var fd=function(s){var p=s.split('-');return+p[2]+' '+MN[+p[1]-1]};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function calc(){
  var e=S.sessions.slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  var b=S.start,T=0,P=0,pts=[{d:S.startDate,b:b,i:-1}];
  e.forEach(function(x,i){b+=x.p;P+=x.p;T+=(x.t||0);pts.push({d:x.d,b:b,i:i})});
  return{e:e,b:b,T:T,P:P,pts:pts};
}
function chart(all){
  var pts=all;
  if(per!=='all'){var c=new Date();c.setDate(c.getDate()-(per==='week'?7:30));var cut=c.toISOString().slice(0,10);
    var f=all.filter(function(p){return p.d>=cut});var pre=all.filter(function(p){return p.d<cut});
    pts=(pre.length?[pre[pre.length-1]]:[]).concat(f)}
  var n=pts.length;if(n<2)return'<div class="cap" style="padding:30px;text-align:center">Недостатньо даних за цей період.</div>';
  var W=900,H=330,L=30,R=40,T0=80,B0=34,vs=pts.map(function(p){return p.b}),mn=Math.min.apply(0,vs),mx=Math.max.apply(0,vs);
  if(mx===mn){mx+=1000;mn-=1000}var pd=(mx-mn)*.08;mn-=pd;mx+=pd;
  var X=function(i){return L+i*(W-L-R)/(n-1)},Y=function(v){return H-B0-(v-mn)/(mx-mn)*(H-T0-B0)};
  var s='';
  if(S.start>mn&&S.start<mx)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(S.start)+'" y2="'+Y(S.start)+'" stroke="#444" stroke-dasharray="5 5"/>';
  for(var i=1;i<n;i++)s+='<line x1="'+X(i-1)+'" y1="'+Y(pts[i-1].b)+'" x2="'+X(i)+'" y2="'+Y(pts[i].b)+'" stroke="'+(pts[i].b>=pts[i-1].b?'#4caf50':'#ef5350')+'" stroke-width="3" stroke-linecap="round"/>';
  if(n<80)for(i=0;i<n;i++)s+='<circle cx="'+X(i)+'" cy="'+Y(pts[i].b)+'" r="4" fill="'+(i&&pts[i].b<pts[i-1].b?'#ef5350':'#4caf50')+'" stroke="#000" stroke-width="1.5"><title>'+fd(pts[i].d)+': '+$(pts[i].b)+'</title></circle>';
  var ann='',used=[];
  function call(i,l1,l2,col){var x=X(i),y=Y(pts[i].b),bx=Math.max(4,Math.min(W-124,x-60)),by=Math.max(6,y-72);
    for(var u=0;u<used.length;u++)if(Math.abs(used[u]-bx)<115)return;used.push(bx);
    ann+='<line x1="'+x+'" y1="'+(by+44)+'" x2="'+x+'" y2="'+y+'" stroke="'+col+'" opacity=".6"/><rect x="'+bx+'" y="'+by+'" width="120" height="44" rx="8" fill="#141414" stroke="'+col+'"/><text x="'+(bx+60)+'" y="'+(by+20)+'" text-anchor="middle" fill="'+col+'" font-weight="700" font-size="14" class="m">'+l1+'</text><text x="'+(bx+60)+'" y="'+(by+36)+'" text-anchor="middle" fill="#9a9a9a" font-size="11">'+l2+'</text>';
    ann+='<circle cx="'+x+'" cy="'+y+'" r="6" fill="#fff" stroke="#000" stroke-width="2"/>'}
  var pk=0;for(i=1;i<n;i++)if(pts[i].b>pts[pk].b)pk=i;
  [[S.start*5,K(S.start*5)+C],[S.start*10,K(S.start*10)+C],[S.start*20,K(S.start*20)+C],[S.start*50,K(S.start*50)+C],[S.start*100,K(S.start*100)+C]].forEach(function(m){
    for(var j=1;j<n;j++)if(pts[j-1].b<m[0]&&pts[j].b>=m[0]){call(j,m[1],fd(pts[j].d),'#6fdc7a');break}});
  if(pk>0&&pk<n-1)call(pk,'ПІК '+K(pts[pk].b)+C,fd(pts[pk].d),'#f5a800');
  var lx=X(n-1),ly=Y(pts[n-1].b);
  s+=ann+'<circle cx="'+lx+'" cy="'+ly+'" r="14" fill="#6fdc7a" opacity=".25"/><circle cx="'+lx+'" cy="'+ly+'" r="8" fill="#6fdc7a" stroke="#000" stroke-width="2"/>';
  var cnt=Math.min(6,n),lab='';for(i=0;i<cnt;i++){var k=Math.round(i*(n-1)/Math.max(1,cnt-1));lab+='<text x="'+X(k)+'" y="'+(H-10)+'" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="700">'+fd(pts[k].d).toUpperCase()+'</text>'}
  return'<svg viewBox="0 0 '+W+' '+H+'">'+s+lab+'</svg>';
}
function dpm(c){
  var bk=[],t=0,p=0,cum=0;
  if(step===0){c.e.forEach(function(x){if(x.t>0){cum+=x.t;bk.push({x:cum,v:x.p/x.t,d:x.d})}});return bk}
  c.e.forEach(function(x){var rem=x.t||0;if(!rem)return;var rate=x.p/x.t;while(rem>1e-9){var tk=Math.min(rem,step-t);t+=tk;p+=rate*tk;cum+=tk;rem-=tk;if(t>=step-1e-9){bk.push({x:cum,v:p/t});t=0;p=0}}});
  if(t>0)bk.push({x:cum,v:p/t,part:1});
  return bk;
}
function dchart(bk,avg){
  if(bk.length<2)return'<div class="cap" style="padding:30px;text-align:center">Потрібно більше турнірів для цього кроку.</div>';
  var W=900,H=280,L=60,R=40,T0=30,B0=34,n=bk.length,m=Math.max(1,Math.max.apply(0,bk.map(function(b){return Math.abs(b.v)})),Math.abs(avg))*1.2;
  var X=function(i){return L+i*(W-L-R)/(n-1)},Y=function(v){return T0+(1-(v+m)/(2*m))*(H-T0-B0)};
  var s='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="#555"/>';
  [m,m/2,-m/2,-m].forEach(function(v){s+='<text x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" fill="#9a9a9a" font-size="11" class="m">'+(v>0?'+':'')+v.toFixed(1)+C+'</text>'});
  s+='<text x="'+(L-8)+'" y="'+(Y(0)+4)+'" text-anchor="end" fill="#9a9a9a" font-size="11">0</text>';
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(avg)+'" y2="'+Y(avg)+'" stroke="#5a8a5a" stroke-dasharray="6 5"/>';
  for(var i=1;i<n;i++)s+='<line x1="'+X(i-1)+'" y1="'+Y(bk[i-1].v)+'" x2="'+X(i)+'" y2="'+Y(bk[i].v)+'" stroke="'+(bk[i].v>=0?'#6fdc7a':'#ef5350')+'" stroke-width="2.5"/>';
  bk.forEach(function(b,i){s+='<circle cx="'+X(i)+'" cy="'+Y(b.v)+'" r="5" fill="#0a0a0a" stroke="'+(b.v>=0?'#6fdc7a':'#ef5350')+'" stroke-width="2.5"><title>'+(b.d?fd(b.d)+' · ':'')+K(b.x)+' MTT: '+b.v.toFixed(1)+C+'</title></circle><text x="'+X(i)+'" y="'+(H-10)+'" text-anchor="middle" fill="#9a9a9a" font-size="11" font-weight="700">'+K(b.x)+'</text>'});
  return'<svg viewBox="0 0 '+W+' '+H+'">'+s+'</svg>';
}
function bars(e){
  var d=e.filter(function(x){return x.t>0});if(!d.length)return'<div class="cap" style="padding:30px;text-align:center">Додай сесії з кількістю турнірів.</div>';
  var W=900,H=230,L=50,B0=30,T0=14,n=d.length,mx=Math.max.apply(0,d.map(function(x){return x.t})),avg=d.reduce(function(a,x){return a+x.t},0)/n;
  var bw=(W-L-10)/n,Y=function(v){return H-B0-v/mx*(H-B0-T0)},mi=d.findIndex(function(x){return x.t===mx}),s='';
  d.forEach(function(x,i){s+='<rect x="'+(L+i*bw+bw*.12)+'" y="'+Y(x.t)+'" width="'+bw*.76+'" height="'+(H-B0-Y(x.t))+'" fill="'+(i===n-1?'#f5a800':i===mi?'#6fdc7a':'#4e8ba6')+'"><title>'+fd(x.d)+': '+x.t+'</title></rect>'});
  s+='<line x1="'+L+'" x2="'+(W-10)+'" y1="'+Y(avg)+'" y2="'+Y(avg)+'" stroke="#999" stroke-dasharray="4 4"/><text x="'+(L-6)+'" y="'+(Y(mx)+12)+'" text-anchor="end" fill="#ddd" font-weight="700" font-size="14" class="m">'+mx+'</text><text x="'+(L-6)+'" y="'+(Y(avg)+5)+'" text-anchor="end" fill="#ddd" font-weight="700" font-size="14" class="m">'+Math.round(avg)+'</text>';
  [0,Math.floor((n-1)/2),n-1].forEach(function(k,j){s+='<text x="'+(L+k*bw+bw/2)+'" y="'+(H-8)+'" text-anchor="'+(j===0?'start':j===2?'end':'middle')+'" fill="#9a9a9a" font-size="13">'+fd(d[k].d)+'</text>'});
  return{svg:'<svg viewBox="0 0 '+W+' '+H+'">'+s+'</svg>',avg:Math.round(avg),last:d[n-1].t};
}
function render(){
  var c=calc(),pr=Math.min(100,Math.max(0,(c.b-S.start)/(S.goal-S.start)*100)),prf=c.b-S.start;
  var day=Math.max(1,Math.floor((new Date()-new Date(S.startDate+'T00:00:00'))/864e5)+1);
  var last=c.e.length?c.e[c.e.length-1].d:null,avg=c.T?c.P/c.T:0;
  var h='<header><div class="logo">♠</div><div><b>'+esc(S.name)+' Marathon</b><small>марафон '+K(S.start)+C+' → '+K(S.goal)+C+'</small></div>'+(canEdit?'<button class="s" id="set">Налаштування</button>':'')+'</header>';
  h+='<div class="pg"><div class="t m"><span>ПРОГРЕС ДО '+K(S.goal)+C+'</span><span class="pc">'+pr.toFixed(2)+'%</span></div><div class="bar"><i style="width:'+pr+'%"></i></div></div><div class="w">';
  if(canEdit&&showSet)h+='<div class="card"><div class="hd"><h3>Налаштування</h3></div><form id="sf"><input name="name" value="'+esc(S.name)+'" placeholder="Нік"><input name="tag" value="'+esc(S.tag)+'" placeholder="Підпис"><input type="date" name="sd" value="'+S.startDate+'"><input type="number" name="st" value="'+S.start+'" placeholder="Старт"><input type="number" name="goal" value="'+S.goal+'" placeholder="Мета"><input name="cur" value="'+esc(C)+'" placeholder="Валюта" style="width:80px"><button>Зберегти</button></form><div style="margin-top:10px;font-size:13px">Фото: <input type="file" id="ph" accept="image/*"></div><div class="hint">Дата старту · стартовий банкролл · мета · валюта</div></div>';
  h+='<div class="card hero"><div class="who"><div class="av">'+(S.photo?'<img src="'+S.photo+'" alt="">':'♠')+'</div><div><h2>'+esc(S.name)+'<span class="tag">АВТОР</span></h2><small>'+esc(S.tag)+(last?' · остання сесія: '+fd(last):'')+'</small></div></div><div class="tiles">'+
   tile('Банкролл',$(c.b),cl(prf)||'g','старт: '+$(S.start))+tile('Профіт',sg(c.P),cl(c.P)||'g','')+tile('День марафону','#'+day,'y','з '+fd(S.startDate)+' '+S.startDate.slice(0,4))+tile('Зіграно MTT',c.T.toLocaleString('uk-UA'),'','всього за марафон')+'</div></div>';
  h+='<div class="card"><div class="hd"><h3 class="m">📈 ГРАФІК МАРАФОНА</h3><div class="pills">'+pill('week','Тиждень')+pill('month','Місяць')+pill('all','Весь час')+'</div></div><div class="chart">'+chart(c.pts)+'</div><div class="cap">За вибраний період: <b class="m">'+c.e.length+'</b> сесій</div></div>';
  var bk=dpm(c),rem=avg>0?Math.ceil((S.goal-c.b)/avg):null,fi=bk;
  h+='<div class="card"><div class="hd"><h3>⚡ Долар з турніру</h3></div><div class="k3"><div><em>за весь марафон</em><b class="m '+cl(avg)+'">'+(avg>0?'+':'')+avg.toFixed(1)+C+'/MTT</b><small class="m">'+K(c.P)+C+' / '+c.T+' MTT</small></div><div><em>до '+K(S.goal)+C+' залишилось</em><b class="m">'+(rem?'~'+rem.toLocaleString('uk-UA'):'—')+' <small>турнірів</small></b></div><div><em>лінія тренда</em><b class="m '+cl(avg)+'">'+(avg>0?'+':'')+avg.toFixed(1)+C+'/MTT</b><small>середнє по всіх MTT</small></div></div>'+
   '<div class="hd"><span class="cap">крок <select id="st">'+[0,10,50,100].map(function(v){return'<option value="'+v+'"'+(v===step?' selected':'')+'>'+(v?v+' MTT':'1 сесія')+'</option>'}).join('')+'</select></span></div><div class="chart">'+dchart(bk,avg)+'</div></div>';
  var br=bars(c.e);
  h+='<div class="card"><div class="hd"><h3>♠ Турнірів за сесію</h3>'+(br.svg?'<span class="cap">середнє: <b class="m">'+br.avg+'</b> · остання: <b class="m y">'+br.last+'</b></span>':'')+'</div><div class="chart">'+(br.svg||br)+'</div></div>';
  if(canEdit){var t=new Date().toISOString().slice(0,10);
    h+='<div class="card"><div class="hd"><h3>Додати сесію</h3></div><form id="f"><input type="date" name="d" value="'+t+'" required><input type="number" name="p" step="any" placeholder="Профіт (350 або -120)" required><input type="number" name="t" min="0" placeholder="К-сть MTT" required><input name="n" placeholder="Нотатка"><button>Додати</button></form><div class="hint">Форму бачиш лише ти. Якщо за день уже є сесія, запис додасться окремим рядком.</div></div>'}
  h+='<div class="card"><div class="hd"><h3>Історія сесій</h3></div><div class="tw"><table><tr><th>Дата</th><th>Нотатка</th><th class="n">MTT</th><th class="n">Профіт</th><th class="n">Банкролл</th>'+(canEdit?'<th></th>':'')+'</tr>';
  if(!c.e.length)h+='<tr><td colspan="6" class="cap">Поки що записів немає.</td></tr>';
  for(var i=c.e.length-1;i>=0;i--){var x=c.e[i];h+='<tr><td>'+fd(x.d)+'</td><td>'+esc(x.n)+'</td><td class="n m">'+(x.t||0)+'</td><td class="n m '+cl(x.p)+'">'+sg(x.p)+'</td><td class="n m">'+$(c.pts[i+1].b)+'</td>'+(canEdit?'<td><button class="x" data-i="'+S.sessions.indexOf(x)+'">✕</button></td>':'')+'</tr>'}
  h+='</table></div></div></div>';
  h+='<div style="text-align:center;padding:6px 0 30px"><button class="x" id="lg">'+(canEdit?'Вийти':'Вхід')+'</button></div>';
  app.innerHTML=h;
  var lg=document.getElementById('lg');
  if(lg)lg.onclick=function(){if(canEdit){localStorage.removeItem('pw');pw='';canEdit=false;showSet=false;render()}else{var p=prompt('Пароль');if(p)login(p)}};
  Array.prototype.forEach.call(app.querySelectorAll('[data-per]'),function(b){b.onclick=function(){per=b.dataset.per;render()}});
  var st=document.getElementById('st');if(st)st.onchange=function(){step=+st.value;render()};
  var f=document.getElementById('f');
  if(f)f.onsubmit=function(ev){ev.preventDefault();var d=new FormData(f);S.sessions.push({d:d.get('d'),p:parseFloat(d.get('p')),t:parseInt(d.get('t'),10)||0,n:d.get('n')||''});save()};
  Array.prototype.forEach.call(app.querySelectorAll('button.x'),function(b){b.onclick=function(){if(b.dataset.arm){S.sessions.splice(+b.dataset.i,1);save()}else{b.dataset.arm=1;b.textContent='Видалити?'}}});
  var se=document.getElementById('set');
  if(se)se.onclick=function(){showSet=!showSet;render()};
  var ph=document.getElementById('ph');
  if(ph)ph.onchange=function(){var f=ph.files[0];if(!f)return;var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var z=240,cv=document.createElement('canvas');cv.width=cv.height=z;var m=Math.min(im.width,im.height);cv.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);S.photo=cv.toDataURL('image/jpeg',.85);URL.revokeObjectURL(u);save()};im.src=u};
  var sf=document.getElementById('sf');
  if(sf)sf.onsubmit=function(ev){ev.preventDefault();var d=new FormData(sf),a=+d.get('st'),g=+d.get('goal');S.name=d.get('name')||S.name;S.tag=d.get('tag')||'';if(/^\d{4}-\d{2}-\d{2}$/.test(d.get('sd')))S.startDate=d.get('sd');if(a>0)S.start=a;if(g>S.start)S.goal=g;S.cur=d.get('cur')||'$';C=S.cur;showSet=false;save()};
}
function tile(l,v,c,s){return'<div class="tile"><small>'+l+'</small><b class="m '+c+'">'+v+'</b><span>'+s+'</span></div>'}
function pill(k,l){return'<button data-per="'+k+'"'+(per===k?' class="on"':'')+'>'+l+'</button>'}
function save(){
  render();clearTimeout(timer);
  timer=setTimeout(function(){fetch('/api/data',{method:'POST',headers:{authorization:'Bearer '+pw,'content-type':'application/json'},body:JSON.stringify(S)}).then(function(r){if(!r.ok)alert('Не збережено: '+r.status)}).catch(function(){alert('Помилка мережі, не збережено')})},300);
}
function login(p,quiet){
  fetch('/api/data',{method:'POST',headers:{authorization:'Bearer '+p}}).then(function(r){
    if(r.ok){pw=p;localStorage.setItem('pw',p);canEdit=true;render()}
    else{localStorage.removeItem('pw');pw='';if(!quiet)alert('Невірний пароль')}
  }).catch(function(){if(!quiet)alert('Помилка мережі')});
}
render();
fetch('/api/data',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){if(d&&d.sessions){S=d;C=S.cur||'$'}render()}).catch(function(){});
if(pw)login(pw,true);
})();
</script>
